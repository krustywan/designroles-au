name: Probe (testing only)

# Runs on any branch named probe/... to test new sources from GitHub's computers.
# It never publishes the board.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the PDF reader
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Run the probe
        run: bash discovery/run.sh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: discovery/out/
          if-no-files-found: ignore
